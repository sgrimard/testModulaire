spring.application.name=test6-app-ext1
server.address=0.0.0.0
server.port=8102

spring.datasource.url=jdbc:postgresql://localhost:5436/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
# Le schéma est géré par les SchemaContribution de chaque module, pas par Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flux SSE (/events) : pas de délai maximal.
spring.mvc.async.request-timeout=-1

# L'IHM de bureau (Electron, origine app://desktop) et le serveur de développement Vite
# appellent l'API depuis une autre origine.
catalogue.cors.origins=app://desktop,http://*:5173

