quarkus.http.host=0.0.0.0
quarkus.http.port=8088

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/postgres
quarkus.devservices.enabled=false
# Le schéma est géré par les SchemaContribution de chaque module, pas par Hibernate.
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.rest-client.product-api.url=http://localhost:8088
quarkus.rest-client.checking-api.url=http://localhost:8088
%test.quarkus.rest-client.product-api.url=http://localhost:8081
%test.quarkus.rest-client.checking-api.url=http://localhost:8081
